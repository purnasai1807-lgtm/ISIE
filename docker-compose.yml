services:
  backend:
    build: ./backend
    environment:
      PORT: 8080
      HOST: 0.0.0.0
    env_file: ./backend/.env
    ports: ["8080:8080"]
    restart: unless-stopped
  frontend:
    build: .
    environment:
      BACKEND_URL: http://backend:8080
    ports: ["3000:3000"]
    depends_on: [backend]
    restart: unless-stopped
